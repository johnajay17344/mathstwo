<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Hope School - JSS2 Mathematics Indices</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .name-screen {
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .name-screen.hidden {
            display: none;
        }

        .emoji-welcome {
            font-size: 60px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .name-screen h2 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .name-screen p {
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .name-input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #studentName {
            padding: 15px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 10px;
            transition: all 0.3s;
        }

        #studentName:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .quiz-screen {
            padding: 30px;
            display: none;
        }

        .quiz-screen.active {
            display: block;
        }

        .progress-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }

        .score-display {
            font-size: 16px;
            font-weight: 700;
            color: #764ba2;
            background: #f0e6ff;
            padding: 8px 15px;
            border-radius: 20px;
            min-width: 80px;
            text-align: center;
        }

        .question-counter {
            font-size: 13px;
            color: #999;
        }

        .question-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
        }

        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-btn {
            padding: 15px;
            font-size: 16px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-weight: 500;
            color: #333;
        }

        .answer-btn:hover {
            border-color: #667eea;
            background: #f0e6ff;
            transform: translateX(5px);
        }

        .answer-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: 600;
        }

        .answer-btn.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            font-weight: 600;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .working {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-left: 3px solid currentColor;
            padding-left: 12px;
            line-height: 1.6;
        }

        .results-screen {
            display: none;
            padding: 40px 30px;
            text-align: center;
            flex-direction: column;
            gap: 25px;
        }

        .results-screen.active {
            display: flex;
        }

        .trophy {
            font-size: 80px;
            animation: bounce 2s infinite;
        }

        .results-screen h2 {
            color: #667eea;
            font-size: 26px;
        }

        .final-score {
            font-size: 48px;
            font-weight: 700;
            color: #764ba2;
            margin: 20px 0;
        }

        .score-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .submit-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .nav-buttons {
            display: none;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .prev-btn {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
        }

        .prev-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
        }

        .next-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 15px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .quiz-screen,
            .name-screen {
                padding: 20px 15px;
            }

            .question-text {
                font-size: 16px;
            }

            .answer-btn {
                padding: 12px;
                font-size: 14px;
            }

            .final-score {
                font-size: 40px;
            }

            .trophy {
                font-size: 60px;
            }

            .nav-buttons {
                gap: 10px;
            }

            .nav-btn {
                min-width: 100px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Sweet Hope School</h1>
            <p>JSS2 Mathematics - Indices (First & Second Laws)</p>
        </div>

        <div class="name-screen" id="nameScreen">
            <div class="emoji-welcome">👋</div>
            <h2>Welcome to Sweet Hope School!</h2>
            <p>Get ready for an amazing mathematics challenge on Indices!</p>
            <div class="name-input-group">
                <input 
                    type="text" 
                    id="studentName" 
                    placeholder="Enter your full name here..."
                    autocomplete="off"
                >
                <button class="start-btn" onclick="startQuiz()">Start Quiz 🚀</button>
            </div>
        </div>

        <div class="quiz-screen" id="quizScreen">
            <div class="progress-bar">
                <div class="question-counter">Question <span id="currentQuestion">1</span> of 50</div>
                <div class="score-display"><span id="scorePercentage">0</span>%</div>
            </div>

            <div class="question-card">
                <div class="question-text" id="questionText"></div>
                <div class="answers-container" id="answersContainer"></div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="nav-buttons" id="navButtons">
                <button class="nav-btn prev-btn" id="prevBtn" onclick="prevQuestion()">← Previous</button>
                <button class="nav-btn next-btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
            </div>
        </div>

        <div class="results-screen" id="resultsScreen">
            <div class="trophy">🏆</div>
            <h2>Quiz Complete!</h2>
            <div class="final-score" id="finalScore">0%</div>
            <div class="score-message" id="scoreMessage"></div>
            <button class="submit-btn" onclick="submitResults()">Submit to Teacher ✉️</button>
        </div>
    </div>
    <script>
const questions = [
    { q: "Find the LCM of 15 and 33", options: ["495", "11", "165", "15"], correct: 2, working: "15 = 3 × 5 and 33 = 3 × 11. LCM = 3 × 5 × 11 = 165" },
    { q: "Change 0.85 to a fraction in its lowest form", options: ["85/10", "17/20", "8/5", "17/10"], correct: 1, working: "0.85 = 85/100. Divide top and bottom by 5: 17/20" },
    { q: "Write 8 × 10⁻³ as a decimal", options: ["0.08", "0.0008", "8000", "0.008"], correct: 3, working: "8 × 10⁻³ = 8/10³ = 8/1000 = 0.008" },
    { q: "Which of these is a prime number?", options: ["13", "15", "21", "27"], correct: 0, working: "13 can only be divided by 1 and itself. 15 = 3×5, 21 = 3×7, 27 = 3×9" },
    { q: "Change 3/8 to a decimal", options: ["0.38", "0.35", "0.375", "0.83"], correct: 2, working: "Divide the numerator by the denominator: 3 ÷ 8 = 0.375" },
    { q: "Fill in the boxes: 30% = ___ = ___", options: ["3/100 = 0.03", "3/10 = 0.3", "30/10 = 3.0", "1/3 = 0.3"], correct: 1, working: "30% = 30/100 = 3/10 = 0.3" },
    { q: "Express 36 as a product of prime factors", options: ["2 × 3³", "2³ × 3", "2² × 3", "2² × 3²"], correct: 3, working: "36 = 2 × 2 × 3 × 3 = 2² × 3²" },
    { q: "Find the HCF of 12 and 18", options: ["6", "3", "12", "36"], correct: 0, working: "Factors of 12: 1, 2, 3, 4, 6, 12. Factors of 18: 1, 2, 3, 6, 9, 18. The highest common factor is 6" },
    { q: "Change 5/11 to a decimal", options: ["0.5", "0.0455...", "0.4545...", "0.5555..."], correct: 2, working: "5 ÷ 11 = 0.454545... The group 45 repeats forever" },
    { q: "Change 120% to a fraction in its lowest form", options: ["12/5", "6/5", "1/5", "3/5"], correct: 1, working: "120/100. Divide top and bottom by 20: 6/5" },
    { q: "Write 0.089 in standard form", options: ["8.9 × 10⁻³", "8.9 × 10²", "0.89 × 10⁻²", "8.9 × 10⁻²"], correct: 3, working: "0.089 = 8.9/100 = 8.9 × 10⁻²" },
    { q: "Which of these numbers is divisible by 9?", options: ["739", "741", "738", "743"], correct: 2, working: "Sum of digits must be divisible by 9. 7+3+8 = 18, and 18 is divisible by 9" },
    { q: "Find the LCM of 8 and 12", options: ["48", "24", "96", "4"], correct: 1, working: "8 = 2³ and 12 = 2² × 3. Take the highest powers: 2³ × 3 = 24" },
    { q: "Change 15% to a decimal", options: ["0.15", "1.5", "0.015", "15"], correct: 0, working: "Divide by 100: 15/100 = 0.15" },
    { q: "Change 7/20 to a percentage", options: ["7%", "27%", "70%", "35%"], correct: 3, working: "7/20 × 100 = 7 × 5 = 35%" },
    { q: "Which of these is NOT a prime number?", options: ["1", "2", "3", "5"], correct: 0, working: "A prime number has exactly two factors. 1 has only one factor, so it is not prime" },
    { q: "Change 0.25 to a fraction in its lowest form", options: ["1/25", "25/10", "1/4", "2/5"], correct: 2, working: "0.25 = 25/100. Divide top and bottom by 25: 1/4" },
    { q: "Write 7.2 × 10⁻⁴ as a decimal", options: ["0.0072", "0.00072", "0.000072", "7200"], correct: 1, working: "7.2 × 10⁻⁴ = 7.2/10000 = 0.00072" },
    { q: "Change 98% to a fraction in its lowest form", options: ["98/10", "9/8", "4/5", "49/50"], correct: 3, working: "98/100. Divide top and bottom by 2: 49/50" },
    { q: "Which list contains only even numbers?", options: ["1, 3, 5, 7", "2, 3, 5, 7", "2, 4, 6, 8", "4, 6, 9, 10"], correct: 2, working: "Even numbers are divisible by 2 without a remainder: 2, 4, 6, 8" },
    { q: "Find the HCF of 15 and 40", options: ["5", "3", "10", "15"], correct: 0, working: "Factors of 15: 1, 3, 5, 15. Factors of 40: 1, 2, 4, 5, 8, 10, 20, 40. Common factors are 1 and 5, so the HCF is 5" },
    { q: "Change 2/3 to a decimal", options: ["0.6", "0.333...", "0.067", "0.666..."], correct: 3, working: "2 ÷ 3 = 0.666... The digit 6 repeats forever, so it is a recurring decimal" },
    { q: "Express 32 as a product of prime factors", options: ["2⁴", "2⁵", "2⁶", "2⁴ × 3"], correct: 1, working: "32 = 2 × 2 × 2 × 2 × 2 = 2⁵" },
    { q: "Change 0.23 to a fraction", options: ["23/10", "2.3/100", "23/100", "32/100"], correct: 2, working: "Two decimal places, so the denominator is 100: 0.23 = 23/100 (already in lowest form)" },
    { q: "Change 5% to a fraction in its lowest form", options: ["1/20", "1/5", "5/10", "1/50"], correct: 0, working: "5/100. Divide top and bottom by 5: 1/20" },
    { q: "Write 2.23 × 10⁻² as a decimal", options: ["0.223", "0.00223", "223", "0.0223"], correct: 3, working: "2.23 × 10⁻² = 2.23/100 = 0.0223" },
    { q: "Find the LCM of 24 and 36", options: ["144", "72", "12", "864"], correct: 1, working: "24 = 2³ × 3 and 36 = 2² × 3². LCM = 2³ × 3² = 72" },
    { q: "Change 256% to a decimal", options: ["0.256", "25.6", "2.56", "0.0256"], correct: 2, working: "256/100 = 2.56" },
    { q: "Express 200 as a product of prime factors", options: ["2³ × 5²", "2² × 5³", "2² × 5²", "2⁴ × 5"], correct: 0, working: "200 = 2 × 2 × 2 × 5 × 5 = 2³ × 5²" },
    { q: "Which of these numbers is divisible by 4?", options: ["214", "722", "518", "316"], correct: 3, working: "The last two digits must be divisible by 4. 16 ÷ 4 = 4" },
    { q: "Change 3/5 to a percentage", options: ["35%", "60%", "53%", "6%"], correct: 1, working: "Multiply by 100: 3/5 × 100 = 3 × 20 = 60%" },
    { q: "Write 0.006 in standard form", options: ["6 × 10⁻²", "6 × 10²", "6 × 10⁻³", "6 × 10³"], correct: 2, working: "0.006 = 6/1000 = 6 × 10⁻³" },
    { q: "Which of these fractions gives a recurring decimal?", options: ["1/4", "3/5", "7/8", "1/3"], correct: 3, working: "1/3 = 0.333... (never ends). 1/4 = 0.25, 3/5 = 0.6 and 7/8 = 0.875 all terminate" },
    { q: "Change 0.875 to a fraction in its lowest form", options: ["7/10", "7/8", "875/100", "8/7"], correct: 1, working: "0.875 = 875/1000. Divide top and bottom by 125: 7/8" },
    { q: "Find the HCF of 54 and 108", options: ["27", "18", "54", "108"], correct: 2, working: "54 divides into 108 exactly (108 ÷ 54 = 2), so the HCF is 54" },
    { q: "Write 0.0000075 in standard form", options: ["7.5 × 10⁻⁶", "7.5 × 10⁻⁵", "7.5 × 10⁶", "7.5 × 10⁻⁷"], correct: 0, working: "0.0000075 = 7.5/1,000,000 = 7.5 × 10⁻⁶" },
    { q: "Change 20% to a fraction in its lowest form", options: ["1/2", "2/5", "1/20", "1/5"], correct: 3, working: "Divide by 100: 20/100. Divide top and bottom by 20: 1/5" },
    { q: "Which of these numbers is divisible by 3?", options: ["235", "107", "234", "1214"], correct: 2, working: "Sum of digits must be divisible by 3. 2+3+4 = 9, and 9 is divisible by 3" },
    { q: "Change 1/25 to a decimal", options: ["0.4", "0.04", "0.25", "0.004"], correct: 1, working: "1 ÷ 25 = 0.04" },
    { q: "Find the LCM of 12 and 15", options: ["60", "30", "180", "3"], correct: 0, working: "12 = 2² × 3 and 15 = 3 × 5. LCM = 2² × 3 × 5 = 60" },
    { q: "Fill in the boxes: ___ = ___ = 0.65", options: ["6.5% = 13/20", "65% = 13/2", "65% = 13/20", "0.65% = 65/100"], correct: 2, working: "0.65 × 100 = 65%. Also 0.65 = 65/100 = 13/20" },
    { q: "Change 7/8 to a decimal", options: ["0.78", "0.785", "0.087", "0.875"], correct: 3, working: "7 ÷ 8 = 0.875" },
    { q: "Which of these numbers is divisible by 6?", options: ["137", "138", "145", "251"], correct: 1, working: "A number divisible by 6 is even and its digit sum is divisible by 3. 138 is even and 1+3+8 = 12" },
    { q: "Write 4.6 × 10⁻⁴ as a decimal", options: ["0.0046", "0.000046", "0.00046", "4600"], correct: 2, working: "4.6 × 10⁻⁴ = 4.6/10000 = 0.00046" },
    { q: "Change 5/8 to a percentage", options: ["62.5%", "58%", "65%", "6.25%"], correct: 0, working: "5/8 × 100 = 5 × 12.5 = 62.5%" },
    { q: "Which set shows whole numbers?", options: ["1, 2, 3, 4...", "...-2, -1, 0, 1, 2...", "0, 1/2, 1, 3/2...", "0, 1, 2, 3, 4..."], correct: 3, working: "Whole numbers start from 0 and go on: 0, 1, 2, 3, 4..." },
    { q: "Change 8% to a decimal", options: ["0.8", "0.08", "8.0", "0.008"], correct: 1, working: "8/100 = 0.08" },
    { q: "Write 0.001122 in standard form", options: ["1.122 × 10⁻²", "1.122 × 10³", "1.122 × 10⁻³", "1.122 × 10⁻⁴"], correct: 2, working: "0.001122 = 1.122/1000 = 1.122 × 10⁻³" },
    { q: "Express 108 as a product of prime factors", options: ["2² × 3³", "2³ × 3²", "2² × 3²", "2 × 3⁴"], correct: 0, working: "108 = 2 × 2 × 3 × 3 × 3 = 2² × 3³" },
    { q: "What are ALL the common factors of 12 and 18?", options: ["1, 2, 3 and 4", "1, 3, 6 and 9", "1, 2 and 3", "1, 2, 3 and 6"], correct: 3, working: "Factors of 12: 1, 2, 3, 4, 6, 12. Factors of 18: 1, 2, 3, 6, 9, 18. Common: 1, 2, 3 and 6" }
];

let currentQuestionIndex = 0;
let score = 0;
let shuffledQuestions = [];
let studentName = '';
let answers = {};

function startQuiz() {
    const name = document.getElementById('studentName').value.trim();
    if (!name) {
        alert('Please enter your full name to continue! 📝');
        return;
    }
    studentName = name;
    shuffledQuestions = [...questions]; // no shuffling
    document.getElementById('nameScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.add('active');
    loadQuestion();
}

function loadQuestion() {
    const question = shuffledQuestions[currentQuestionIndex];

    // options stay in the written order
    const shuffledOptions = question.options.map((text, i) => ({
        text: text,
        isCorrect: i === question.correct
    }));
    question.correctText = question.options[question.correct];

    document.getElementById('questionText').textContent = question.q;
    document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
    updateScore();

    const container = document.getElementById('answersContainer');
    container.innerHTML = '';
    shuffledOptions.forEach((option) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = option.text;
        btn.onclick = () => answerQuestion(option.isCorrect, option.text, question.working);
        container.appendChild(btn);
    });

    document.getElementById('feedback').innerHTML = '';
    document.getElementById('feedback').classList.remove('show');
    document.getElementById('navButtons').style.display = 'none';

    if (answers[currentQuestionIndex] !== undefined) {
        const isCorrect = answers[currentQuestionIndex];
        const buttons = container.querySelectorAll('.answer-btn');
        const correctText = question.correctText;

        buttons.forEach(btn => btn.disabled = true);

        const feedback = document.getElementById('feedback');
        if (isCorrect) {
            feedback.className = 'feedback show correct';
            feedback.innerHTML = `<div class="feedback-title">✅ Correct Answer!</div>`;
        } else {
            feedback.className = 'feedback show incorrect';
            feedback.innerHTML = `<div class="feedback-title">❌ Incorrect - Here's the Correct Answer:</div>
                <div class="working">📚 Working:<br>${question.working}</div>`;
        }
        buttons.forEach(btn => {
            if (btn.textContent === correctText) {
                btn.classList.add('correct');
            }
        });

        document.getElementById('navButtons').style.display = 'flex';
    }

    updateNavigation();
}

function updateNavigation() {
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    prevBtn.style.display = currentQuestionIndex === 0 ? 'none' : 'block';

    if (currentQuestionIndex === shuffledQuestions.length - 1) {
        nextBtn.textContent = 'Submit & See Results ✅';
    } else {
        nextBtn.textContent = 'Next Question →';
    }
}

function answerQuestion(isCorrect, selectedText, working) {
    if (answers[currentQuestionIndex] !== undefined) {
        return;
    }

    const buttons = document.querySelectorAll('.answer-btn');
    const correctText = shuffledQuestions[currentQuestionIndex].correctText;

    buttons.forEach(btn => btn.disabled = true);
    answers[currentQuestionIndex] = isCorrect;

    const feedback = document.getElementById('feedback');
    if (isCorrect) {
        feedback.className = 'feedback show correct';
        feedback.innerHTML = `<div class="feedback-title">✅ Correct Answer!</div>`;
        buttons.forEach(btn => {
            if (btn.textContent === selectedText) {
                btn.classList.add('correct');
            }
        });
    } else {
        feedback.className = 'feedback show incorrect';
        feedback.innerHTML = `<div class="feedback-title">❌ Incorrect - Here's the Correct Answer:</div>
            <div class="working">📚 Working:<br>${working}</div>`;
        buttons.forEach(btn => {
            if (btn.textContent === selectedText) {
                btn.classList.add('incorrect');
            }
            if (btn.textContent === correctText) {
                btn.classList.add('correct');
            }
        });
    }

    document.getElementById('navButtons').style.display = 'flex';
    updateScore();
}

function nextQuestion() {
    if (currentQuestionIndex < shuffledQuestions.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
    }
}

function updateScore() {
    let totalCorrect = Object.values(answers).filter(a => a === true).length;
    const percentage = totalCorrect > 0 ? Math.round((totalCorrect / (currentQuestionIndex + 1)) * 100) : 0;
    document.getElementById('scorePercentage').textContent = percentage;
}

function showResults() {
    document.getElementById('quizScreen').classList.remove('active');
    document.getElementById('resultsScreen').classList.add('active');

    const totalCorrect = Object.values(answers).filter(a => a === true).length;
    const percentage = Math.round((totalCorrect / shuffledQuestions.length) * 100);
    document.getElementById('finalScore').textContent = percentage + '%';

    let message = '';
    if (percentage === 100) message = '🌟 Perfect Score! Outstanding! 🌟';
    else if (percentage >= 90) message = '🎉 Excellent work! Keep it up!';
    else if (percentage >= 80) message = '👏 Great job! Well done!';
    else if (percentage >= 70) message = '💪 Good effort! Practice more!';
    else if (percentage >= 60) message = '📚 Nice try! Keep studying!';
    else message = '🎯 Keep practicing! You\'ll improve!';

    document.getElementById('scoreMessage').textContent = `${studentName}, you scored ${totalCorrect} out of ${shuffledQuestions.length} questions.\n${message}`;
}

function submitResults() {
    const totalCorrect = Object.values(answers).filter(a => a === true).length;
    const percentage = Math.round((totalCorrect / shuffledQuestions.length) * 100);
    const subject = `Maths Assignment - ${studentName}`;
    const body = `Student Name: ${studentName}\nScore: ${totalCorrect}/${shuffledQuestions.length}\nPercentage: ${percentage}%\n\nAssignment: Fractions, Decimals, Percentages, Standard Form, HCF and LCM`;
    window.location.href = `mailto:justzcontentz@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
</script>
</body>
</html>
