<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Hope School - JSS2 Mathematics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        /* NAME ENTRY SCREEN */
        .name-screen {
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .name-screen.hidden {
            display: none;
        }

        .emoji-welcome {
            font-size: 60px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .name-screen h2 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .name-screen p {
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .name-input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #studentName {
            padding: 15px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 10px;
            transition: all 0.3s;
        }

        #studentName:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* QUIZ SCREEN */
        .quiz-screen {
            padding: 30px;
            display: none;
        }

        .quiz-screen.active {
            display: block;
        }

        .progress-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }

        .score-display {
            font-size: 16px;
            font-weight: 700;
            color: #764ba2;
            background: #f0e6ff;
            padding: 8px 15px;
            border-radius: 20px;
            min-width: 80px;
            text-align: center;
        }

        .question-counter {
            font-size: 13px;
            color: #999;
        }

        /* QUESTION CARD */
        .question-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* ANSWER OPTIONS */
        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-btn {
            padding: 15px;
            font-size: 16px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-weight: 500;
            color: #333;
        }

        .answer-btn:hover {
            border-color: #667eea;
            background: #f0e6ff;
            transform: translateX(5px);
        }

        .answer-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: 600;
        }

        .answer-btn.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            font-weight: 600;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        /* FEEDBACK */
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .working {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-left: 3px solid currentColor;
            padding-left: 12px;
        }

        /* RESULTS SCREEN */
        .results-screen {
            display: none;
            padding: 40px 30px;
            text-align: center;
            flex-direction: column;
            gap: 25px;
        }

        .results-screen.active {
            display: flex;
        }

        .trophy {
            font-size: 80px;
            animation: bounce 2s infinite;
        }

        .results-screen h2 {
            color: #667eea;
            font-size: 26px;
        }

        .final-score {
            font-size: 48px;
            font-weight: 700;
            color: #764ba2;
            margin: 20px 0;
        }

        .score-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .submit-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 480px) {
            .container {
                border-radius: 15px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .quiz-screen,
            .name-screen {
                padding: 20px 15px;
            }

            .question-text {
                font-size: 16px;
            }

            .answer-btn {
                padding: 12px;
                font-size: 14px;
            }

            .final-score {
                font-size: 40px;
            }

            .trophy {
                font-size: 60px;
            }
        }

        .emoji-correct {
            color: #28a745;
            font-weight: 700;
        }

        .emoji-incorrect {
            color: #dc3545;
            font-weight: 700;
        }

        /* NAVIGATION BUTTONS */
        .nav-buttons {
            display: none;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .prev-btn {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
        }

        .prev-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
        }

        .next-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .nav-buttons {
                gap: 10px;
            }

            .nav-btn {
                min-width: 100px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>🎓 Sweet Hope School</h1>
            <p>JSS2 Mathematics Assignment - Chapter 2: Indices</p>
        </div>

        <!-- NAME ENTRY SCREEN -->
        <div class="name-screen" id="nameScreen">
            <div class="emoji-welcome">👋</div>
            <h2>Welcome to Sweet Hope School!</h2>
            <p>Get ready for an amazing mathematics challenge!</p>
            <div class="name-input-group">
                <input 
                    type="text" 
                    id="studentName" 
                    placeholder="Enter your full name here..."
                    autocomplete="off"
                >
                <button class="start-btn" onclick="startQuiz()">Start Quiz 🚀</button>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div class="quiz-screen" id="quizScreen">
            <div class="progress-bar">
                <div class="question-counter">Question <span id="currentQuestion">1</span> of 50</div>
                <div class="score-display"><span id="scorePercentage">0</span>%</div>
            </div>

            <div class="question-card">
                <div class="question-text" id="questionText"></div>
                <div class="answers-container" id="answersContainer"></div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="nav-buttons" id="navButtons">
                <button class="nav-btn prev-btn" id="prevBtn" onclick="prevQuestion()">← Previous</button>
                <button class="nav-btn next-btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
            </div>
        </div>

        <!-- RESULTS SCREEN -->
        <div class="results-screen" id="resultsScreen">
            <div class="trophy">🏆</div>
            <h2>Quiz Complete!</h2>
            <div class="final-score" id="finalScore">0%</div>
            <div class="score-message" id="scoreMessage"></div>
            <button class="submit-btn" onclick="submitResults()">Submit to Teacher ✉️</button>
        </div>
    </div>

    <script>
        // QUESTION DATABASE
        const questions = [
            { q: "Express 7 × 7 × 7 × 7 × 7 in index form", options: ["7⁵", "7⁴", "7⁶", "5⁷"], correct: 0, working: "Counting 5 times 7 is multiplied, so: 7⁵" },
            { q: "Express 4 × 4 × 4 × 4 × 4 × 4 in index form", options: ["4⁶", "4⁵", "4⁷", "6⁴"], correct: 0, working: "Counting 6 times 4 is multiplied, so: 4⁶" },
            { q: "Express 8 × 8 × 8 in index form", options: ["8³", "8²", "8⁴", "3⁸"], correct: 0, working: "Counting 3 times 8 is multiplied, so: 8³" },
            { q: "Express 10 × 10 × 10 × 10 × 10 × 10 in index form", options: ["10⁶", "10⁵", "10⁷", "6¹⁰"], correct: 0, working: "Counting 6 times 10 is multiplied, so: 10⁶" },
            { q: "Express (5/5) × (5/5) × (5/5) in index form", options: ["(5/5)³", "(5/5)²", "(5/5)⁴", "5³"], correct: 0, working: "Counting 3 times (5/5) is multiplied, so: (5/5)³" },
            { q: "Express (-3) × (-3) × (-3) × (-3) in index form", options: ["(-3)⁴", "(-3)³", "(-3)⁵", "4⁻³"], correct: 0, working: "Counting 4 times (-3) is multiplied, so: (-3)⁴" },
            { q: "Write 8 in index form", options: ["2³", "2²", "2⁴", "8¹"], correct: 0, working: "8 = 2 × 2 × 2 = 2³" },
            { q: "Write 27 in index form", options: ["3³", "3²", "3⁴", "27¹"], correct: 0, working: "27 = 3 × 3 × 3 = 3³" },
            { q: "Write 81 in index form", options: ["3⁴", "3³", "3²", "81¹"], correct: 0, working: "81 = 3 × 3 × 3 × 3 = 3⁴" },
            { q: "Write 216 in index form", options: ["6³", "6²", "6⁴", "216¹"], correct: 0, working: "216 = 6 × 6 × 6 = 6³" },
            { q: "Write 32 in index form", options: ["2⁵", "2⁴", "2³", "32¹"], correct: 0, working: "32 = 2 × 2 × 2 × 2 × 2 = 2⁵" },
            { q: "Write 243 in index form", options: ["3⁵", "3⁴", "3³", "243¹"], correct: 0, working: "243 = 3 × 3 × 3 × 3 × 3 = 3⁵" },
            { q: "Write 1000 in index form", options: ["10³", "10²", "10⁴", "1000¹"], correct: 0, working: "1000 = 10 × 10 × 10 = 10³" },
            { q: "Write 1331 in index form", options: ["11³", "11²", "11⁴", "1331¹"], correct: 0, working: "1331 = 11 × 11 × 11 = 11³" },
            { q: "Write 1296 in index form", options: ["6⁴", "6³", "6²", "1296¹"], correct: 0, working: "1296 = 6 × 6 × 6 × 6 = 6⁴" },
            { q: "Evaluate 2⁹", options: ["512", "256", "128", "1024"], correct: 0, working: "2⁹ = 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2 = 512" },
            { q: "Evaluate 4⁵", options: ["1024", "512", "256", "2048"], correct: 0, working: "4⁵ = 4 × 4 × 4 × 4 × 4 = 1024" },
            { q: "Evaluate (-5)²", options: ["25", "-25", "10", "-10"], correct: 0, working: "(-5)² = (-5) × (-5) = 25 (negative × negative = positive)" },
            { q: "Evaluate (1/2)³", options: ["1/8", "1/6", "1/4", "3/2"], correct: 0, working: "(1/2)³ = (1/2) × (1/2) × (1/2) = 1/8" },
            { q: "Evaluate (3/7)³", options: ["27/343", "9/49", "3/7", "27/7"], correct: 0, working: "(3/7)³ = (3/7) × (3/7) × (3/7) = 27/343" },
            { q: "Evaluate (12)³", options: ["1728", "144", "36", "864"], correct: 0, working: "(12)³ = 12 × 12 × 12 = 1728" },
            { q: "Evaluate 5²", options: ["25", "10", "15", "7"], correct: 0, working: "5² = 5 × 5 = 25" },
            { q: "Evaluate 3²", options: ["9", "6", "8", "5"], correct: 0, working: "3² = 3 × 3 = 9" },
            { q: "Evaluate 2⁸", options: ["256", "128", "512", "64"], correct: 0, working: "2⁸ = 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2 = 256" },
            { q: "Find 5² + 3³", options: ["52", "34", "25", "27"], correct: 0, working: "5² + 3³ = 25 + 27 = 52" },
            { q: "Find 2⁵ + 4²", options: ["48", "32", "36", "40"], correct: 0, working: "2⁵ + 4² = 32 + 16 = 48" },
            { q: "Find 7² - 3³", options: ["22", "49", "27", "20"], correct: 0, working: "7² - 3³ = 49 - 27 = 22" },
            { q: "Find 4⁵ + 5²", options: ["1049", "1024", "25", "1050"], correct: 0, working: "4⁵ + 5² = 1024 + 25 = 1049" },
            { q: "Find (1.5)³ - (0.5)²", options: ["3.125", "1.5", "3.375", "2.875"], correct: 0, working: "(1.5)³ - (0.5)² = 3.375 - 0.25 = 3.125" },
            { q: "Find 2³ × 3²", options: ["72", "36", "8", "9"], correct: 0, working: "2³ × 3² = 8 × 9 = 72" },
            { q: "Find 5² × 2⁴", options: ["400", "100", "50", "200"], correct: 0, working: "5² × 2⁴ = 25 × 16 = 400" },
            { q: "Find 3³ ÷ 2⁴", options: ["27/16", "3", "27", "16"], correct: 0, working: "3³ ÷ 2⁴ = 27 ÷ 16 = 27/16" },
            { q: "Simplify 2 × 2 × 2 × 2 × 2", options: ["2⁵", "2⁴", "2³", "2⁶"], correct: 0, working: "Counting 5 factors of 2, we get: 2⁵" },
            { q: "Simplify 7 × 7", options: ["7²", "7³", "7¹", "7⁴"], correct: 0, working: "Counting 2 factors of 7, we get: 7²" },
            { q: "Which is larger: 2⁷ or 3⁴?", options: ["2⁷", "3⁴", "They're equal", "Cannot determine"], correct: 0, working: "2⁷ = 128; 3⁴ = 81; So 2⁷ is larger" },
            { q: "Evaluate (-2)⁵", options: ["-32", "32", "-10", "10"], correct: 0, working: "(-2)⁵ = (-2) × (-2) × (-2) × (-2) × (-2) = -32" },
            { q: "Evaluate (-3)³", options: ["-27", "27", "-9", "9"], correct: 0, working: "(-3)³ = (-3) × (-3) × (-3) = -27" },
            { q: "Evaluate 10⁰", options: ["1", "0", "10", "undefined"], correct: 0, working: "Any number to the power 0 equals 1, so 10⁰ = 1" },
            { q: "Express 625 in index form", options: ["5⁴", "5³", "5²", "5⁵"], correct: 0, working: "625 = 5 × 5 × 5 × 5 = 5⁴" },
            { q: "Express 128 in index form", options: ["2⁷", "2⁶", "2⁸", "2⁵"], correct: 0, working: "128 = 2 × 2 × 2 × 2 × 2 × 2 × 2 = 2⁷" },
            { q: "Express 343 in index form", options: ["7³", "7²", "7⁴", "7⁵"], correct: 0, working: "343 = 7 × 7 × 7 = 7³" },
            { q: "Find 6²", options: ["36", "12", "30", "42"], correct: 0, working: "6² = 6 × 6 = 36" },
            { q: "Find 9²", options: ["81", "18", "64", "100"], correct: 0, working: "9² = 9 × 9 = 81" },
            { q: "Find 10⁴", options: ["10000", "1000", "100", "40"], correct: 0, working: "10⁴ = 10 × 10 × 10 × 10 = 10000" },
            { q: "Evaluate (2/3)²", options: ["4/9", "2/3", "4/3", "2/9"], correct: 0, working: "(2/3)² = (2/3) × (2/3) = 4/9" },
            { q: "Evaluate (-4)²", options: ["16", "-16", "8", "-8"], correct: 0, working: "(-4)² = (-4) × (-4) = 16 (negative × negative = positive)" },
            { q: "Find 3³ + 2³", options: ["35", "27", "8", "30"], correct: 0, working: "3³ + 2³ = 27 + 8 = 35" },
            { q: "Find 4² × 3²", options: ["144", "16", "9", "48"], correct: 0, working: "4² × 3² = 16 × 9 = 144" },
            { q: "Evaluate 2² × 3² × 4", options: ["144", "64", "48", "96"], correct: 0, working: "2² × 3² × 4 = 4 × 9 × 4 = 144" },
            { q: "What is y × y × y .....10 times in index form?", options: ["y¹⁰", "y⁹", "y¹¹", "y⁸"], correct: 0, working: "y multiplied 10 times = y¹⁰" },
            { q: "What is a × a × a .....20 times in index form?", options: ["a²⁰", "a¹⁹", "a²¹", "a¹⁸"], correct: 0, working: "a multiplied 20 times = a²⁰" }
        ];

        // STATE VARIABLES
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];
        let studentName = '';
        let answers = {}; // Store user answers

        // SHUFFLE ARRAY FUNCTION
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // SHUFFLE ANSWER OPTIONS
        function shuffleAnswers(correct, incorrect) {
            const all = [correct, ...incorrect];
            return shuffle(all);
        }

        // START QUIZ
        function startQuiz() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                alert('Please enter your full name to continue! 📝');
                return;
            }
            studentName = name;
            shuffledQuestions = shuffle(questions);
            document.getElementById('nameScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.add('active');
            loadQuestion();
        }

        // LOAD QUESTION
        function loadQuestion() {
            const question = shuffledQuestions[currentQuestionIndex];
            
            // Use stored shuffled options if question was already viewed
            let shuffledOptions;
            if (shuffledQuestions[currentQuestionIndex].shuffledOptions) {
                shuffledOptions = shuffledQuestions[currentQuestionIndex].shuffledOptions;
            } else {
                shuffledOptions = shuffle([
                    { text: question.options[question.correct], isCorrect: true },
                    { text: question.options[1], isCorrect: question.correct === 1 },
                    { text: question.options[2], isCorrect: question.correct === 2 },
                    { text: question.options[3], isCorrect: question.correct === 3 }
                ]);
                // Store correct answer for highlighting later
                shuffledQuestions[currentQuestionIndex].correctText = shuffledOptions.find(o => o.isCorrect).text;
                shuffledQuestions[currentQuestionIndex].shuffledOptions = shuffledOptions;
            }

            document.getElementById('questionText').textContent = question.q;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            updateScore();

            const container = document.getElementById('answersContainer');
            container.innerHTML = '';
            shuffledOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = option.text;
                btn.onclick = () => answerQuestion(option.isCorrect, option.text, question.working);
                container.appendChild(btn);
            });

            document.getElementById('feedback').innerHTML = '';
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('navButtons').style.display = 'none';

            // If already answered, show previous state
            if (answers[currentQuestionIndex] !== undefined) {
                const isCorrect = answers[currentQuestionIndex];
                const buttons = container.querySelectorAll('.answer-btn');
                const correctText = shuffledQuestions[currentQuestionIndex].correctText;
                
                buttons.forEach(btn => btn.disabled = true);
                
                if (isCorrect) {
                    const feedback = document.getElementById('feedback');
                    feedback.className = 'feedback show correct';
                    feedback.innerHTML = `<div class="feedback-title">✅ Correct Answer!</div>`;
                    buttons.forEach(btn => {
                        if (btn.textContent === correctText) {
                            btn.classList.add('correct');
                        }
                    });
                } else {
                    const feedback = document.getElementById('feedback');
                    feedback.className = 'feedback show incorrect';
                    feedback.innerHTML = `<div class="feedback-title">❌ Incorrect - Here's the Correct Answer:</div>
                        <div class="working">📚 Working:<br>${question.working}</div>`;
                    buttons.forEach(btn => {
                        if (btn.textContent === correctText) {
                            btn.classList.add('correct');
                        }
                    });
                }
                
                document.getElementById('navButtons').style.display = 'flex';
            }

            updateNavigation();
        }

        // UPDATE NAVIGATION BUTTONS
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (currentQuestionIndex === 0) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'block';
            }

            if (currentQuestionIndex === shuffledQuestions.length - 1) {
                nextBtn.textContent = 'Submit & See Results ✅';
            } else {
                nextBtn.textContent = 'Next Question →';
            }
        }

        // ANSWER QUESTION
        function answerQuestion(isCorrect, selectedText, working) {
            // Don't re-answer if already answered
            if (answers[currentQuestionIndex] !== undefined) {
                return;
            }

            const buttons = document.querySelectorAll('.answer-btn');
            const correctText = shuffledQuestions[currentQuestionIndex].correctText;
            
            buttons.forEach(btn => btn.disabled = true);

            // Store the answer
            answers[currentQuestionIndex] = isCorrect;

            if (isCorrect) {
                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback show correct';
                feedback.innerHTML = `<div class="feedback-title">✅ Correct Answer!</div>`;
                buttons.forEach(btn => {
                    if (btn.textContent === selectedText) {
                        btn.classList.add('correct');
                    }
                });
            } else {
                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback show incorrect';
                feedback.innerHTML = `<div class="feedback-title">❌ Incorrect - Here's the Correct Answer:</div>
                    <div class="working">📚 Working:<br>${working}</div>`;
                buttons.forEach(btn => {
                    if (btn.textContent === selectedText) {
                        btn.classList.add('incorrect');
                    }
                    // Highlight the correct answer
                    if (btn.textContent === correctText) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Show navigation buttons after answering
            document.getElementById('navButtons').style.display = 'flex';
            updateScore();
        }

        // NEXT QUESTION
        function nextQuestion() {
            if (currentQuestionIndex < shuffledQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        // PREVIOUS QUESTION
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        // UPDATE SCORE DISPLAY
        function updateScore() {
            // Count total correct answers so far
            let totalCorrect = Object.values(answers).filter(a => a === true).length;
            const percentage = totalCorrect > 0 ? Math.round((totalCorrect / (currentQuestionIndex + 1)) * 100) : 0;
            document.getElementById('scorePercentage').textContent = percentage;
        }

        // SHOW RESULTS
        function showResults() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultsScreen').classList.add('active');

            // Calculate final score from answers
            const totalCorrect = Object.values(answers).filter(a => a === true).length;
            const percentage = Math.round((totalCorrect / shuffledQuestions.length) * 100);
            document.getElementById('finalScore').textContent = percentage + '%';

            let message = '';
            if (percentage === 100) message = '🌟 Perfect Score! Outstanding! 🌟';
            else if (percentage >= 90) message = '🎉 Excellent work! Keep it up!';
            else if (percentage >= 80) message = '👏 Great job! Well done!';
            else if (percentage >= 70) message = '💪 Good effort! Practice more!';
            else if (percentage >= 60) message = '📚 Nice try! Keep studying!';
            else message = '🎯 Keep practicing! You\'ll improve!';

            document.getElementById('scoreMessage').textContent = `${studentName}, you scored ${totalCorrect} out of ${shuffledQuestions.length} questions.\n${message}`;
        }

        // SUBMIT RESULTS
        function submitResults() {
            const totalCorrect = Object.values(answers).filter(a => a === true).length;
            const percentage = Math.round((totalCorrect / shuffledQuestions.length) * 100);
            const subject = `JSS2 Math Assignment - ${studentName}`;
            const body = `Student Name: ${studentName}%0AScore: ${totalCorrect}/${shuffledQuestions.length}%0APercentage: ${percentage}%%0A%0AAssignment: Chapter 2 - Indices`;
            window.location.href = `mailto:justzcontentz@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }
    </script>
</body>
</html>
