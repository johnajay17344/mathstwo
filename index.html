<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Hope School - JSS2 Mathematics Indices</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .name-screen {
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .name-screen.hidden {
            display: none;
        }

        .emoji-welcome {
            font-size: 60px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .name-screen h2 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .name-screen p {
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .name-input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #studentName {
            padding: 15px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 10px;
            transition: all 0.3s;
        }

        #studentName:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .quiz-screen {
            padding: 30px;
            display: none;
        }

        .quiz-screen.active {
            display: block;
        }

        .progress-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }

        .score-display {
            font-size: 16px;
            font-weight: 700;
            color: #764ba2;
            background: #f0e6ff;
            padding: 8px 15px;
            border-radius: 20px;
            min-width: 80px;
            text-align: center;
        }

        .question-counter {
            font-size: 13px;
            color: #999;
        }

        .question-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
        }

        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-btn {
            padding: 15px;
            font-size: 16px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-weight: 500;
            color: #333;
        }

        .answer-btn:hover {
            border-color: #667eea;
            background: #f0e6ff;
            transform: translateX(5px);
        }

        .answer-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: 600;
        }

        .answer-btn.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            font-weight: 600;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .working {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-left: 3px solid currentColor;
            padding-left: 12px;
            line-height: 1.6;
        }

        .results-screen {
            display: none;
            padding: 40px 30px;
            text-align: center;
            flex-direction: column;
            gap: 25px;
        }

        .results-screen.active {
            display: flex;
        }

        .trophy {
            font-size: 80px;
            animation: bounce 2s infinite;
        }

        .results-screen h2 {
            color: #667eea;
            font-size: 26px;
        }

        .final-score {
            font-size: 48px;
            font-weight: 700;
            color: #764ba2;
            margin: 20px 0;
        }

        .score-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .submit-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .nav-buttons {
            display: none;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .prev-btn {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
        }

        .prev-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
        }

        .next-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 15px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .quiz-screen,
            .name-screen {
                padding: 20px 15px;
            }

            .question-text {
                font-size: 16px;
            }

            .answer-btn {
                padding: 12px;
                font-size: 14px;
            }

            .final-score {
                font-size: 40px;
            }

            .trophy {
                font-size: 60px;
            }

            .nav-buttons {
                gap: 10px;
            }

            .nav-btn {
                min-width: 100px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Sweet Hope School</h1>
            <p>JSS2 Mathematics - Indices (First & Second Laws)</p>
        </div>

        <div class="name-screen" id="nameScreen">
            <div class="emoji-welcome">👋</div>
            <h2>Welcome to Sweet Hope School!</h2>
            <p>Get ready for an amazing mathematics challenge on Indices!</p>
            <div class="name-input-group">
                <input 
                    type="text" 
                    id="studentName" 
                    placeholder="Enter your full name here..."
                    autocomplete="off"
                >
                <button class="start-btn" onclick="startQuiz()">Start Quiz 🚀</button>
            </div>
        </div>

        <div class="quiz-screen" id="quizScreen">
            <div class="progress-bar">
                <div class="question-counter">Question <span id="currentQuestion">1</span> of 50</div>
                <div class="score-display"><span id="scorePercentage">0</span>%</div>
            </div>

            <div class="question-card">
                <div class="question-text" id="questionText"></div>
                <div class="answers-container" id="answersContainer"></div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="nav-buttons" id="navButtons">
                <button class="nav-btn prev-btn" id="prevBtn" onclick="prevQuestion()">← Previous</button>
                <button class="nav-btn next-btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
            </div>
        </div>

        <div class="results-screen" id="resultsScreen">
            <div class="trophy">🏆</div>
            <h2>Quiz Complete!</h2>
            <div class="final-score" id="finalScore">0%</div>
            <div class="score-message" id="scoreMessage"></div>
            <button class="submit-btn" onclick="submitResults()">Submit to Teacher ✉️</button>
        </div>
    </div>

    <script>
        const questions = [
    // THIRD LAW: (a^m)^n = a^(m×n)
    { q: "Simplify: (2³)²", options: ["2⁶", "2⁵", "2⁹", "2⁸"], correct: 0, working: "Using third law: (2³)² = 2^(3×2) = 2⁶" },
    { q: "Simplify: (3²)³", options: ["3⁶", "3⁵", "3⁸", "3⁹"], correct: 0, working: "Using third law: (3²)³ = 3^(2×3) = 3⁶" },
    { q: "Simplify: (x⁴)³", options: ["x¹²", "x⁷", "x⁶", "x⁸"], correct: 0, working: "Using third law: (x⁴)³ = x^(4×3) = x¹²" },
    { q: "Simplify: (a⁵)²", options: ["a¹⁰", "a⁷", "a⁶", "a²⁵"], correct: 0, working: "Using third law: (a⁵)² = a^(5×2) = a¹⁰" },
    { q: "Simplify: (m⁶)³", options: ["m¹⁸", "m⁹", "m¹⁵", "m⁸"], correct: 0, working: "Using third law: (m⁶)³ = m^(6×3) = m¹⁸" },
    { q: "Simplify: (b³)⁴ × b²", options: ["b¹⁴", "b¹⁰", "b¹²", "b²⁴"], correct: 0, working: "(b³)⁴ = b¹², then b¹² × b² = b^(12+2) = b¹⁴" },
    { q: "Simplify: (x²)³ × x⁴", options: ["x¹⁰", "x⁹", "x¹²", "x²⁴"], correct: 0, working: "(x²)³ = x⁶, then x⁶ × x⁴ = x^(6+4) = x¹⁰" },
    { q: "Simplify: (a³)⁴ ÷ a⁵", options: ["a⁷", "a¹⁷", "a⁹", "a⁸"], correct: 0, working: "(a³)⁴ = a¹², then a¹² ÷ a⁵ = a^(12-5) = a⁷" },
    { q: "Simplify: (3²)³ ÷ 3⁴", options: ["3²", "3¹⁰", "3⁴", "3³"], correct: 0, working: "(3²)³ = 3⁶, then 3⁶ ÷ 3⁴ = 3^(6-4) = 3²" },
    { q: "Simplify: (y⁵)² ÷ y⁶", options: ["y⁴", "y¹⁶", "y⁶", "y³"], correct: 0, working: "(y⁵)² = y¹⁰, then y¹⁰ ÷ y⁶ = y^(10-6) = y⁴" },
    { q: "Simplify: (k³)³ × k²", options: ["k¹¹", "k⁸", "k¹⁴", "k¹⁸"], correct: 0, working: "(k³)³ = k⁹, then k⁹ × k² = k^(9+2) = k¹¹" },
    { q: "Simplify: (n⁴)² × (n²)³", options: ["n¹⁴", "n¹²", "n¹⁰", "n⁴⁸"], correct: 0, working: "(n⁴)² = n⁸ and (n²)³ = n⁶, then n⁸ × n⁶ = n¹⁴" },
    { q: "Simplify: (5²)³ ÷ 5²", options: ["5⁴", "5⁸", "5³", "5⁶"], correct: 0, working: "(5²)³ = 5⁶, then 5⁶ ÷ 5² = 5^(6-2) = 5⁴" },
    { q: "Simplify: (c²)⁵ ÷ (c³)²", options: ["c⁴", "c⁶", "c⁵", "c⁷"], correct: 0, working: "(c²)⁵ = c¹⁰ and (c³)² = c⁶, then c¹⁰ ÷ c⁶ = c⁴" },
    { q: "Simplify: (x³)² × (x²)⁴ ÷ x⁵", options: ["x⁹", "x¹³", "x⁸", "x¹⁴"], correct: 0, working: "(x³)² = x⁶ and (x²)⁴ = x⁸. x⁶ × x⁸ = x¹⁴, then x¹⁴ ÷ x⁵ = x⁹" },
    { q: "Simplify: (p²)⁴ ÷ (p³)² × p", options: ["p³", "p²", "p⁴", "p⁵"], correct: 0, working: "(p²)⁴ = p⁸ and (p³)² = p⁶. p⁸ ÷ p⁶ = p², then p² × p = p³" },
    { q: "If (2ᵐ)³ = 2¹², find m", options: ["4", "9", "3", "36"], correct: 0, working: "(2ᵐ)³ = 2^(3m) = 2¹², so 3m = 12, m = 4" },
    { q: "If (3ⁿ)² = 3¹⁰, find n", options: ["5", "8", "12", "20"], correct: 0, working: "(3ⁿ)² = 3^(2n) = 3¹⁰, so 2n = 10, n = 5" },
    { q: "If (a³)ᵖ = a²¹, find p", options: ["7", "18", "24", "63"], correct: 0, working: "(a³)ᵖ = a^(3p) = a²¹, so 3p = 21, p = 7" },
    { q: "If (5ˣ)² × 5³ = 5⁹, find x", options: ["3", "6", "2", "4"], correct: 0, working: "(5ˣ)² = 5^(2x), so 5^(2x) × 5³ = 5^(2x+3) = 5⁹. 2x + 3 = 9, 2x = 6, x = 3" },
    { q: "Evaluate: (2³)²", options: ["64", "32", "16", "36"], correct: 0, working: "(2³)² = 2⁶ = 64" },
    { q: "Evaluate: (10²)³", options: ["1,000,000", "100,000", "10,000", "600"], correct: 0, working: "(10²)³ = 10⁶ = 1,000,000" },
    { q: "Evaluate: (2³)² ÷ 2⁴", options: ["4", "8", "16", "2"], correct: 0, working: "(2³)² = 2⁶, then 2⁶ ÷ 2⁴ = 2² = 4" },
    { q: "Evaluate: (2²)³ × 2² ÷ 2⁵", options: ["8", "16", "4", "2"], correct: 0, working: "(2²)³ = 2⁶. 2⁶ × 2² = 2⁸, then 2⁸ ÷ 2⁵ = 2³ = 8" },
    { q: "Evaluate: (3²)² ÷ 3³", options: ["3", "9", "27", "1"], correct: 0, working: "(3²)² = 3⁴, then 3⁴ ÷ 3³ = 3¹ = 3" },

    // FOURTH LAW: a⁰ = 1 (zero index)
    { q: "Evaluate: 5⁰", options: ["1", "0", "5", "Undefined"], correct: 0, working: "Using fourth law: any non-zero number to the power 0 equals 1. So 5⁰ = 1" },
    { q: "Simplify: x⁰ (x ≠ 0)", options: ["1", "0", "x", "x¹"], correct: 0, working: "Using fourth law: x⁰ = 1" },
    { q: "Evaluate: 25⁰", options: ["1", "0", "25", "5"], correct: 0, working: "Using fourth law: 25⁰ = 1" },
    { q: "Evaluate: 7⁰ + 3⁰", options: ["2", "10", "1", "0"], correct: 0, working: "7⁰ = 1 and 3⁰ = 1, so 1 + 1 = 2" },
    { q: "Evaluate: 4⁰ × 6", options: ["6", "24", "0", "1"], correct: 0, working: "4⁰ = 1, so 1 × 6 = 6" },
    { q: "Simplify: 2x⁰ (x ≠ 0)", options: ["2", "0", "2x", "1"], correct: 0, working: "The power 0 applies only to x. So 2x⁰ = 2 × 1 = 2" },
    { q: "Simplify: (3a)⁰ (a ≠ 0)", options: ["1", "3", "0", "3a"], correct: 0, working: "The power 0 applies to the whole bracket. So (3a)⁰ = 1" },
    { q: "Simplify: 3a⁰ (a ≠ 0)", options: ["3", "1", "0", "3a"], correct: 0, working: "The power 0 applies only to a. So 3a⁰ = 3 × 1 = 3" },
    { q: "Evaluate: 8⁰ − 1", options: ["0", "7", "1", "-1"], correct: 0, working: "8⁰ = 1, so 1 − 1 = 0" },
    { q: "Evaluate: 5⁰ + 2⁰ + 9⁰", options: ["3", "16", "1", "0"], correct: 0, working: "5⁰ = 1, 2⁰ = 1, 9⁰ = 1, so 1 + 1 + 1 = 3" },
    { q: "Evaluate: 6⁰ × 6²", options: ["36", "1", "72", "6"], correct: 0, working: "6⁰ = 1 and 6² = 36, so 1 × 36 = 36" },
    { q: "Evaluate: 3² × 3⁰", options: ["9", "1", "6", "0"], correct: 0, working: "3⁰ = 1, so 3² × 3⁰ = 9 × 1 = 9" },
    { q: "Simplify: 2⁵ ÷ 2⁵", options: ["1", "0", "2", "2¹⁰"], correct: 0, working: "Using second law: 2⁵ ÷ 2⁵ = 2^(5-5) = 2⁰ = 1" },
    { q: "Simplify: x⁷ ÷ x⁷ (x ≠ 0)", options: ["1", "0", "x", "x¹⁴"], correct: 0, working: "Using second law: x⁷ ÷ x⁷ = x^(7-7) = x⁰ = 1" },
    { q: "Evaluate: 10⁰ + 10¹", options: ["11", "10", "1", "20"], correct: 0, working: "10⁰ = 1 and 10¹ = 10, so 1 + 10 = 11" },
    { q: "Simplify: (2³)⁰", options: ["1", "8", "0", "6"], correct: 0, working: "Using third law: (2³)⁰ = 2^(3×0) = 2⁰ = 1" },
    { q: "Evaluate: 9⁰ × 2³", options: ["8", "1", "72", "6"], correct: 0, working: "9⁰ = 1 and 2³ = 8, so 1 × 8 = 8" },
    { q: "Evaluate: 4⁰ − 4¹", options: ["-3", "3", "0", "-4"], correct: 0, working: "4⁰ = 1 and 4¹ = 4, so 1 − 4 = -3" },
    { q: "Evaluate: 5x⁰ + 3y⁰ (x, y ≠ 0)", options: ["8", "2", "15", "1"], correct: 0, working: "x⁰ = 1 and y⁰ = 1, so 5(1) + 3(1) = 8" },
    { q: "Evaluate: 2⁰ + 2¹ + 2²", options: ["7", "6", "3", "8"], correct: 0, working: "2⁰ = 1, 2¹ = 2, 2² = 4, so 1 + 2 + 4 = 7" },
    { q: "If 3ⁿ = 1, find n", options: ["0", "1", "3", "-1"], correct: 0, working: "Since 3⁰ = 1, n = 0" },
    { q: "Simplify: (7⁰)⁵", options: ["1", "7", "0", "35"], correct: 0, working: "7⁰ = 1, so (7⁰)⁵ = 1⁵ = 1" },
    { q: "Simplify: a⁴ ÷ a⁴ × a³ (a ≠ 0)", options: ["a³", "a⁴", "a¹¹", "a⁰"], correct: 0, working: "a⁴ ÷ a⁴ = a⁰ = 1, then 1 × a³ = a³" },
    { q: "Evaluate: 6a⁰ + (6a)⁰ (a ≠ 0)", options: ["7", "12", "2", "6"], correct: 0, working: "6a⁰ = 6(1) = 6 and (6a)⁰ = 1, so 6 + 1 = 7" },

    // FIFTH LAW: a⁻ⁿ = 1/aⁿ (negative index)
    { q: "Evaluate: 2⁻¹", options: ["1/2", "2", "-2", "-1/2"], correct: 0, working: "Using fifth law: 2⁻¹ = 1/2¹ = 1/2" },
    { q: "Evaluate: 3⁻²", options: ["1/9", "1/6", "-9", "-6"], correct: 0, working: "Using fifth law: 3⁻² = 1/3² = 1/9" },
    { q: "Evaluate: 5⁻²", options: ["1/25", "1/10", "-25", "-10"], correct: 0, working: "Using fifth law: 5⁻² = 1/5² = 1/25" },
    { q: "Evaluate: 10⁻³", options: ["1/1000", "1/30", "-1000", "-30"], correct: 0, working: "Using fifth law: 10⁻³ = 1/10³ = 1/1000" },
    { q: "Evaluate: 2⁻³", options: ["1/8", "1/6", "-8", "-6"], correct: 0, working: "Using fifth law: 2⁻³ = 1/2³ = 1/8" },
    { q: "Evaluate: 4⁻²", options: ["1/16", "1/8", "-16", "-8"], correct: 0, working: "Using fifth law: 4⁻² = 1/4² = 1/16" },
    { q: "Write x⁻⁴ with a positive index", options: ["1/x⁴", "x⁴", "-x⁴", "1/x⁻⁴"], correct: 0, working: "Using fifth law: x⁻⁴ = 1/x⁴" },
    { q: "Write 3x⁻² with a positive index", options: ["3/x²", "1/(3x²)", "3x²", "-3x²"], correct: 0, working: "The power -2 applies only to x. So 3x⁻² = 3 × (1/x²) = 3/x²" },
    { q: "Write 1/5³ using a negative index", options: ["5⁻³", "5³", "-5³", "3⁻⁵"], correct: 0, working: "Using fifth law: 1/5³ = 5⁻³" },
    { q: "Write 1/y⁶ using a negative index", options: ["y⁻⁶", "y⁶", "-y⁶", "y⁻¹"], correct: 0, working: "Using fifth law: 1/y⁶ = y⁻⁶" },
    { q: "Simplify: 2⁻² × 2⁵", options: ["2³", "2⁷", "2⁻³", "2⁻¹⁰"], correct: 0, working: "Using first law: 2⁻² × 2⁵ = 2^(-2+5) = 2³" },
    { q: "Simplify: 3⁴ × 3⁻⁶", options: ["3⁻²", "3¹⁰", "3²", "3⁻¹⁰"], correct: 0, working: "Using first law: 3⁴ × 3⁻⁶ = 3^(4-6) = 3⁻²" },
    { q: "Simplify: x³ × x⁻⁷", options: ["x⁻⁴", "x⁴", "x⁻¹⁰", "x²¹"], correct: 0, working: "Using first law: x³ × x⁻⁷ = x^(3-7) = x⁻⁴" },
    { q: "Simplify: a⁻² ÷ a³", options: ["a⁻⁵", "a⁻¹", "a⁵", "a¹"], correct: 0, working: "Using second law: a⁻² ÷ a³ = a^(-2-3) = a⁻⁵" },
    { q: "Simplify: 5⁻¹ ÷ 5⁻³", options: ["5²", "5⁻⁴", "5⁴", "5⁻²"], correct: 0, working: "Using second law: 5⁻¹ ÷ 5⁻³ = 5^(-1-(-3)) = 5^(-1+3) = 5²" },
    { q: "Evaluate: 2⁻³ × 2⁵", options: ["4", "1/4", "32", "8"], correct: 0, working: "2⁻³ × 2⁵ = 2^(-3+5) = 2² = 4" },
    { q: "Evaluate: 3⁻² × 3²", options: ["1", "0", "9", "1/9"], correct: 0, working: "3⁻² × 3² = 3^(-2+2) = 3⁰ = 1" },
    { q: "Evaluate: 2⁻² + 2⁻¹", options: ["3/4", "1/8", "3/2", "1/2"], correct: 0, working: "2⁻² = 1/4 and 2⁻¹ = 1/2, so 1/4 + 1/2 = 1/4 + 2/4 = 3/4" },
    { q: "Evaluate: 4⁻¹ × 8", options: ["2", "1/2", "32", "4"], correct: 0, working: "4⁻¹ = 1/4, so 1/4 × 8 = 2" },
    { q: "Simplify: (2⁻¹)³", options: ["1/8", "1/6", "8", "-8"], correct: 0, working: "Using third law: (2⁻¹)³ = 2^(-1×3) = 2⁻³ = 1/2³ = 1/8" },
    { q: "Simplify: (x⁻²)⁻³", options: ["x⁶", "x⁻⁶", "x⁵", "x⁻⁵"], correct: 0, working: "Using third law: (x⁻²)⁻³ = x^((-2)×(-3)) = x⁶" },
    { q: "Simplify: (a³ × a⁻⁵)⁻²", options: ["a⁴", "a⁻⁴", "a⁻¹⁰", "a¹⁶"], correct: 0, working: "a³ × a⁻⁵ = a⁻². Then (a⁻²)⁻² = a^((-2)×(-2)) = a⁴" },
    { q: "Evaluate: (1/3)⁻²", options: ["9", "1/9", "6", "-9"], correct: 0, working: "(1/3)⁻² = 3² = 9 (flip the fraction and make the index positive)" },
    { q: "Evaluate: (2/3)⁻¹", options: ["3/2", "2/3", "-2/3", "-3/2"], correct: 0, working: "(2/3)⁻¹ = 3/2 (flip the fraction)" },
    { q: "If 2ⁿ = 1/8, find n", options: ["-3", "3", "-8", "8"], correct: 0, working: "1/8 = 1/2³ = 2⁻³, so n = -3" }
];

        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];
        let studentName = '';
        let answers = {};

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                alert('Please enter your full name to continue! 📝');
                return;
            }
            studentName = name;
            shuffledQuestions = shuffle(questions);
            document.getElementById('nameScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            const question = shuffledQuestions[currentQuestionIndex];
            
            let shuffledOptions;
            if (shuffledQuestions[currentQuestionIndex].shuffledOptions) {
                shuffledOptions = shuffledQuestions[currentQuestionIndex].shuffledOptions;
            } else {
                shuffledOptions = shuffle([
                    { text: question.options[question.correct], isCorrect: true },
                    { text: question.options[1], isCorrect: question.correct === 1 },
                    { text: question.options[2], isCorrect: question.correct === 2 },
                    { text: question.options[3], isCorrect: question.correct === 3 }
                ]);
                shuffledQuestions[currentQuestionIndex].correctText = shuffledOptions.find(o => o.isCorrect).text;
                shuffledQuestions[currentQuestionIndex].shuffledOptions = shuffledOptions;
            }

            document.getElementById('questionText').textContent = question.q;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            updateScore();

            const container = document.getElementById('answersContainer');
            container.innerHTML = '';
            shuffledOptions.forEach((option) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = option.text;
                btn.onclick = () => answerQuestion(option.isCorrect, option.text, question.working);
                container.appendChild(btn);
            });

            document.getElementById('feedback').innerHTML = '';
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('navButtons').style.display = 'none';

            if (answers[currentQuestionIndex] !== undefined) {
                const isCorrect = answers[currentQuestionIndex];
                const buttons = container.querySelectorAll('.answer-btn');
                const correctText = shuffledQuestions[currentQuestionIndex].correctText;
                
                buttons.forEach(btn => btn.disabled = true);
                
                if (isCorrect) {
                    const feedback = document.getElementById('feedback');
                    feedback.className = 'feedback show correct';
                    feedback.innerHTML = `<div class="feedback-title">✅ Correct Answer!</div>`;
                    buttons.forEach(btn => {
                        if (btn.textContent === correctText) {
                            btn.classList.add('correct');
                        }
                    });
                } else {
                    const feedback = document.getElementById('feedback');
                    feedback.className = 'feedback show incorrect';
                    feedback.innerHTML = `<div class="feedback-title">❌ Incorrect - Here's the Correct Answer:</div>
                        <div class="working">📚 Working:<br>${question.working}</div>`;
                    buttons.forEach(btn => {
                        if (btn.textContent === correctText) {
                            btn.classList.add('correct');
                        }
                    });
                }
                
                document.getElementById('navButtons').style.display = 'flex';
            }

            updateNavigation();
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (currentQuestionIndex === 0) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'block';
            }

            if (currentQuestionIndex === shuffledQuestions.length - 1) {
                nextBtn.textContent = 'Submit & See Results ✅';
            } else {
                nextBtn.textContent = 'Next Question →';
            }
        }

        function answerQuestion(isCorrect, selectedText, working) {
            if (answers[currentQuestionIndex] !== undefined) {
                return;
            }

            const buttons = document.querySelectorAll('.answer-btn');
            const correctText = shuffledQuestions[currentQuestionIndex].correctText;
            
            buttons.forEach(btn => btn.disabled = true);

            answers[currentQuestionIndex] = isCorrect;

            if (isCorrect) {
                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback show correct';
                feedback.innerHTML = `<div class="feedback-title">✅ Correct Answer!</div>`;
                buttons.forEach(btn => {
                    if (btn.textContent === selectedText) {
                        btn.classList.add('correct');
                    }
                });
            } else {
                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback show incorrect';
                feedback.innerHTML = `<div class="feedback-title">❌ Incorrect - Here's the Correct Answer:</div>
                    <div class="working">📚 Working:<br>${working}</div>`;
                buttons.forEach(btn => {
                    if (btn.textContent === selectedText) {
                        btn.classList.add('incorrect');
                    }
                    if (btn.textContent === correctText) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('navButtons').style.display = 'flex';
            updateScore();
        }

        function nextQuestion() {
            if (currentQuestionIndex < shuffledQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function updateScore() {
            let totalCorrect = Object.values(answers).filter(a => a === true).length;
            const percentage = totalCorrect > 0 ? Math.round((totalCorrect / (currentQuestionIndex + 1)) * 100) : 0;
            document.getElementById('scorePercentage').textContent = percentage;
        }

        function showResults() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultsScreen').classList.add('active');

            const totalCorrect = Object.values(answers).filter(a => a === true).length;
            const percentage = Math.round((totalCorrect / shuffledQuestions.length) * 100);
            document.getElementById('finalScore').textContent = percentage + '%';

            let message = '';
            if (percentage === 100) message = '🌟 Perfect Score! Outstanding! 🌟';
            else if (percentage >= 90) message = '🎉 Excellent work! Keep it up!';
            else if (percentage >= 80) message = '👏 Great job! Well done!';
            else if (percentage >= 70) message = '💪 Good effort! Practice more!';
            else if (percentage >= 60) message = '📚 Nice try! Keep studying!';
            else message = '🎯 Keep practicing! You\'ll improve!';

            document.getElementById('scoreMessage').textContent = `${studentName}, you scored ${totalCorrect} out of ${shuffledQuestions.length} questions.\n${message}`;
        }

        function submitResults() {
            const totalCorrect = Object.values(answers).filter(a => a === true).length;
            const percentage = Math.round((totalCorrect / shuffledQuestions.length) * 100);
            const subject = `JSS2 Indices Assignment - ${studentName}`;
            const body = `Student Name: ${studentName}%0AScore: ${totalCorrect}/${shuffledQuestions.length}%0APercentage: ${percentage}%%0A%0AAssignment: Indices - First & Second Laws`;
            window.location.href = `mailto:justzcontentz@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }
    </script>
