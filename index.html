<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Hope School - JSS2 Mathematics Indices</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .name-screen {
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .name-screen.hidden {
            display: none;
        }

        .emoji-welcome {
            font-size: 60px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .name-screen h2 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .name-screen p {
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .name-input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #studentName {
            padding: 15px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 10px;
            transition: all 0.3s;
        }

        #studentName:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .quiz-screen {
            padding: 30px;
            display: none;
        }

        .quiz-screen.active {
            display: block;
        }

        .progress-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }

        .score-display {
            font-size: 16px;
            font-weight: 700;
            color: #764ba2;
            background: #f0e6ff;
            padding: 8px 15px;
            border-radius: 20px;
            min-width: 80px;
            text-align: center;
        }

        .question-counter {
            font-size: 13px;
            color: #999;
        }

        .question-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
        }

        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-btn {
            padding: 15px;
            font-size: 16px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-weight: 500;
            color: #333;
        }

        .answer-btn:hover {
            border-color: #667eea;
            background: #f0e6ff;
            transform: translateX(5px);
        }

        .answer-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: 600;
        }

        .answer-btn.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            font-weight: 600;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .working {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-left: 3px solid currentColor;
            padding-left: 12px;
            line-height: 1.6;
        }

        .results-screen {
            display: none;
            padding: 40px 30px;
            text-align: center;
            flex-direction: column;
            gap: 25px;
        }

        .results-screen.active {
            display: flex;
        }

        .trophy {
            font-size: 80px;
            animation: bounce 2s infinite;
        }

        .results-screen h2 {
            color: #667eea;
            font-size: 26px;
        }

        .final-score {
            font-size: 48px;
            font-weight: 700;
            color: #764ba2;
            margin: 20px 0;
        }

        .score-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .submit-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .nav-buttons {
            display: none;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .prev-btn {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
        }

        .prev-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
        }

        .next-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 15px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .quiz-screen,
            .name-screen {
                padding: 20px 15px;
            }

            .question-text {
                font-size: 16px;
            }

            .answer-btn {
                padding: 12px;
                font-size: 14px;
            }

            .final-score {
                font-size: 40px;
            }

            .trophy {
                font-size: 60px;
            }

            .nav-buttons {
                gap: 10px;
            }

            .nav-btn {
                min-width: 100px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Sweet Hope School</h1>
            <p>JSS2 Mathematics - Indices (First & Second Laws)</p>
        </div>

        <div class="name-screen" id="nameScreen">
            <div class="emoji-welcome">👋</div>
            <h2>Welcome to Sweet Hope School!</h2>
            <p>Get ready for an amazing mathematics challenge on Indices!</p>
            <div class="name-input-group">
                <input 
                    type="text" 
                    id="studentName" 
                    placeholder="Enter your full name here..."
                    autocomplete="off"
                >
                <button class="start-btn" onclick="startQuiz()">Start Quiz 🚀</button>
            </div>
        </div>

        <div class="quiz-screen" id="quizScreen">
            <div class="progress-bar">
                <div class="question-counter">Question <span id="currentQuestion">1</span> of 50</div>
                <div class="score-display"><span id="scorePercentage">0</span>%</div>
            </div>

            <div class="question-card">
                <div class="question-text" id="questionText"></div>
                <div class="answers-container" id="answersContainer"></div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="nav-buttons" id="navButtons">
                <button class="nav-btn prev-btn" id="prevBtn" onclick="prevQuestion()">← Previous</button>
                <button class="nav-btn next-btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
            </div>
        </div>

        <div class="results-screen" id="resultsScreen">
            <div class="trophy">🏆</div>
            <h2>Quiz Complete!</h2>
            <div class="final-score" id="finalScore">0%</div>
            <div class="score-message" id="scoreMessage"></div>
            <button class="submit-btn" onclick="submitResults()">Submit to Teacher ✉️</button>
        </div>
    </div>

    <script>
        const questions = [
            // FIRST LAW: a^m × a^n = a^(m+n)
            { q: "Simplify: 2³ × 2²", options: ["2⁵", "2⁶", "2⁴", "2¹"], correct: 0, working: "Using first law: 2³ × 2² = 2^(3+2) = 2⁵" },
            { q: "Simplify: 3⁴ × 3¹", options: ["3⁵", "3⁴", "3³", "3⁶"], correct: 0, working: "Using first law: 3⁴ × 3¹ = 3^(4+1) = 3⁵" },
            { q: "Simplify: 5² × 5³", options: ["5⁵", "5⁶", "5⁴", "5¹"], correct: 0, working: "Using first law: 5² × 5³ = 5^(2+3) = 5⁵" },
            { q: "Simplify: x⁴ × x²", options: ["x⁶", "x⁸", "x⁵", "x³"], correct: 0, working: "Using first law: x⁴ × x² = x^(4+2) = x⁶" },
            { q: "Simplify: a³ × a⁶", options: ["a⁹", "a⁸", "a¹⁰", "a⁶"], correct: 0, working: "Using first law: a³ × a⁶ = a^(3+6) = a⁹" },
            { q: "Simplify: 7² × 7⁴", options: ["7⁶", "7⁸", "7⁵", "7³"], correct: 0, working: "Using first law: 7² × 7⁴ = 7^(2+4) = 7⁶" },
            { q: "Simplify: b⁵ × b²", options: ["b⁷", "b⁶", "b⁸", "b³"], correct: 0, working: "Using first law: b⁵ × b² = b^(5+2) = b⁷" },
            { q: "Simplify: 4³ × 4²", options: ["4⁵", "4⁶", "4⁴", "4¹"], correct: 0, working: "Using first law: 4³ × 4² = 4^(3+2) = 4⁵" },
            { q: "Simplify: y¹ × y⁸", options: ["y⁹", "y⁸", "y⁷", "y¹⁰"], correct: 0, working: "Using first law: y¹ × y⁸ = y^(1+8) = y⁹" },
            { q: "Simplify: m⁶ × m³", options: ["m⁹", "m⁶", "m¹⁰", "m⁸"], correct: 0, working: "Using first law: m⁶ × m³ = m^(6+3) = m⁹" },
            { q: "Simplify: 2² × 2⁵", options: ["2⁷", "2¹⁰", "2⁶", "2⁸"], correct: 0, working: "Using first law: 2² × 2⁵ = 2^(2+5) = 2⁷" },
            { q: "Simplify: p⁴ × p⁴", options: ["p⁸", "p⁴", "p¹⁶", "p⁷"], correct: 0, working: "Using first law: p⁴ × p⁴ = p^(4+4) = p⁸" },
            { q: "Simplify: 3³ × 3³", options: ["3⁶", "3⁹", "3⁵", "3³"], correct: 0, working: "Using first law: 3³ × 3³ = 3^(3+3) = 3⁶" },
            { q: "Simplify: 6¹ × 6⁵", options: ["6⁶", "6⁵", "6⁷", "6⁴"], correct: 0, working: "Using first law: 6¹ × 6⁵ = 6^(1+5) = 6⁶" },
            { q: "Simplify: z³ × z⁷", options: ["z¹⁰", "z⁸", "z¹¹", "z⁹"], correct: 0, working: "Using first law: z³ × z⁷ = z^(3+7) = z¹⁰" },
            { q: "Simplify: n² × n⁵ × n¹", options: ["n⁸", "n⁷", "n⁹", "n⁶"], correct: 0, working: "Using first law: n² × n⁵ × n¹ = n^(2+5+1) = n⁸" },
            { q: "Simplify: 8² × 8¹", options: ["8³", "8⁴", "8²", "8⁵"], correct: 0, working: "Using first law: 8² × 8¹ = 8^(2+1) = 8³" },
            { q: "Simplify: k⁶ × k²", options: ["k⁸", "k⁶", "k¹⁰", "k⁷"], correct: 0, working: "Using first law: k⁶ × k² = k^(6+2) = k⁸" },
            { q: "Simplify: 9⁴ × 9²", options: ["9⁶", "9⁸", "9⁵", "9²"], correct: 0, working: "Using first law: 9⁴ × 9² = 9^(4+2) = 9⁶" },
            { q: "Simplify: c⁷ × c³", options: ["c¹⁰", "c⁸", "c¹¹", "c⁹"], correct: 0, working: "Using first law: c⁷ × c³ = c^(7+3) = c¹⁰" },
            { q: "Evaluate: 2³ × 2²", options: ["32", "64", "16", "8"], correct: 0, working: "2³ × 2² = 2⁵ = 32" },
            { q: "Evaluate: 3² × 3³", options: ["243", "81", "27", "729"], correct: 0, working: "3² × 3³ = 3⁵ = 243" },
            { q: "Evaluate: 5¹ × 5²", options: ["125", "25", "625", "50"], correct: 0, working: "5¹ × 5² = 5³ = 125" },
            { q: "Evaluate: 2⁴ × 2¹", options: ["32", "16", "64", "8"], correct: 0, working: "2⁴ × 2¹ = 2⁵ = 32" },
            { q: "Evaluate: 4² × 4¹", options: ["64", "16", "32", "8"], correct: 0, working: "4² × 4¹ = 4³ = 64" },

            // SECOND LAW: a^m ÷ a^n = a^(m-n)
            { q: "Simplify: 2⁶ ÷ 2²", options: ["2⁴", "2³", "2⁵", "2⁶"], correct: 0, working: "Using second law: 2⁶ ÷ 2² = 2^(6-2) = 2⁴" },
            { q: "Simplify: 3⁵ ÷ 3²", options: ["3³", "3⁴", "3²", "3⁵"], correct: 0, working: "Using second law: 3⁵ ÷ 3² = 3^(5-2) = 3³" },
            { q: "Simplify: 5⁷ ÷ 5³", options: ["5⁴", "5⁵", "5³", "5⁶"], correct: 0, working: "Using second law: 5⁷ ÷ 5³ = 5^(7-3) = 5⁴" },
            { q: "Simplify: x⁸ ÷ x²", options: ["x⁶", "x⁴", "x⁷", "x⁵"], correct: 0, working: "Using second law: x⁸ ÷ x² = x^(8-2) = x⁶" },
            { q: "Simplify: a¹⁰ ÷ a⁴", options: ["a⁶", "a⁵", "a⁷", "a⁸"], correct: 0, working: "Using second law: a¹⁰ ÷ a⁴ = a^(10-4) = a⁶" },
            { q: "Simplify: 7⁸ ÷ 7⁵", options: ["7³", "7⁴", "7²", "7⁵"], correct: 0, working: "Using second law: 7⁸ ÷ 7⁵ = 7^(8-5) = 7³" },
            { q: "Simplify: b⁹ ÷ b⁶", options: ["b³", "b⁴", "b⁵", "b²"], correct: 0, working: "Using second law: b⁹ ÷ b⁶ = b^(9-6) = b³" },
            { q: "Simplify: 4⁷ ÷ 4³", options: ["4⁴", "4⁵", "4³", "4²"], correct: 0, working: "Using second law: 4⁷ ÷ 4³ = 4^(7-3) = 4⁴" },
            { q: "Simplify: y¹² ÷ y⁸", options: ["y⁴", "y⁵", "y³", "y⁶"], correct: 0, working: "Using second law: y¹² ÷ y⁸ = y^(12-8) = y⁴" },
            { q: "Simplify: m¹¹ ÷ m⁷", options: ["m⁴", "m⁵", "m³", "m⁶"], correct: 0, working: "Using second law: m¹¹ ÷ m⁷ = m^(11-7) = m⁴" },
            { q: "Simplify: 2⁹ ÷ 2⁴", options: ["2⁵", "2⁶", "2⁴", "2³"], correct: 0, working: "Using second law: 2⁹ ÷ 2⁴ = 2^(9-4) = 2⁵" },
            { q: "Simplify: p¹⁵ ÷ p⁷", options: ["p⁸", "p⁷", "p⁹", "p⁶"], correct: 0, working: "Using second law: p¹⁵ ÷ p⁷ = p^(15-7) = p⁸" },
            { q: "Simplify: 3¹⁰ ÷ 3⁶", options: ["3⁴", "3⁵", "3³", "3⁶"], correct: 0, working: "Using second law: 3¹⁰ ÷ 3⁶ = 3^(10-6) = 3⁴" },
            { q: "Simplify: 6⁹ ÷ 6⁴", options: ["6⁵", "6⁴", "6⁶", "6³"], correct: 0, working: "Using second law: 6⁹ ÷ 6⁴ = 6^(9-4) = 6⁵" },
            { q: "Simplify: z¹⁴ ÷ z⁹", options: ["z⁵", "z⁶", "z⁴", "z⁷"], correct: 0, working: "Using second law: z¹⁴ ÷ z⁹ = z^(14-9) = z⁵" },
            { q: "Simplify: n⁸ ÷ n⁵", options: ["n³", "n⁴", "n²", "n⁵"], correct: 0, working: "Using second law: n⁸ ÷ n⁵ = n^(8-5) = n³" },
            { q: "Simplify: 8⁷ ÷ 8³", options: ["8⁴", "8⁵", "8³", "8²"], correct: 0, working: "Using second law: 8⁷ ÷ 8³ = 8^(7-3) = 8⁴" },
            { q: "Simplify: k¹² ÷ k⁶", options: ["k⁶", "k⁵", "k⁷", "k⁴"], correct: 0, working: "Using second law: k¹² ÷ k⁶ = k^(12-6) = k⁶" },
            { q: "Simplify: 9¹¹ ÷ 9⁸", options: ["9³", "9⁴", "9²", "9⁵"], correct: 0, working: "Using second law: 9¹¹ ÷ 9⁸ = 9^(11-8) = 9³" },
            { q: "Simplify: c¹³ ÷ c⁷", options: ["c⁶", "c⁵", "c⁷", "c⁴"], correct: 0, working: "Using second law: c¹³ ÷ c⁷ = c^(13-7) = c⁶" },
            { q: "Evaluate: 2⁶ ÷ 2²", options: ["16", "8", "32", "4"], correct: 0, working: "2⁶ ÷ 2² = 2⁴ = 16" },
            { q: "Evaluate: 3⁵ ÷ 3²", options: ["27", "9", "81", "3"], correct: 0, working: "3⁵ ÷ 3² = 3³ = 27" },
            { q: "Evaluate: 5⁴ ÷ 5²", options: ["25", "5", "125", "10"], correct: 0, working: "5⁴ ÷ 5² = 5² = 25" },
            { q: "Evaluate: 2⁸ ÷ 2⁴", options: ["16", "8", "32", "4"], correct: 0, working: "2⁸ ÷ 2⁴ = 2⁴ = 16" },
            { q: "Evaluate: 4⁵ ÷ 4²", options: ["64", "16", "256", "4"], correct: 0, working: "4⁵ ÷ 4² = 4³ = 64" }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];
        let studentName = '';
        let answers = {};

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                alert('Please enter your full name to continue! 📝');
                return;
            }
            studentName = name;
            shuffledQuestions = shuffle(questions);
            document.getElementById('nameScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            const question = shuffledQuestions[currentQuestionIndex];
            
            let shuffledOptions;
            if (shuffledQuestions[currentQuestionIndex].shuffledOptions) {
                shuffledOptions = shuffledQuestions[currentQuestionIndex].shuffledOptions;
            } else {
                shuffledOptions = shuffle([
                    { text: question.options[question.correct], isCorrect: true },
                    { text: question.options[1], isCorrect: question.correct === 1 },
                    { text: question.options[2], isCorrect: question.correct === 2 },
                    { text: question.options[3], isCorrect: question.correct === 3 }
                ]);
                shuffledQuestions[currentQuestionIndex].correctText = shuffledOptions.find(o => o.isCorrect).text;
                shuffledQuestions[currentQuestionIndex].shuffledOptions = shuffledOptions;
            }

            document.getElementById('questionText').textContent = question.q;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            updateScore();

            const container = document.getElementById('answersContainer');
            container.innerHTML = '';
            shuffledOptions.forEach((option) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = option.text;
                btn.onclick = () => answerQuestion(option.isCorrect, option.text, question.working);
                container.appendChild(btn);
            });

            document.getElementById('feedback').innerHTML = '';
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('navButtons').style.display = 'none';

            if (answers[currentQuestionIndex] !== undefined) {
                const isCorrect = answers[currentQuestionIndex];
                const buttons = container.querySelectorAll('.answer-btn');
                const correctText = shuffledQuestions[currentQuestionIndex].correctText;
                
                buttons.forEach(btn => btn.disabled = true);
                
                if (isCorrect) {
                    const feedback = document.getElementById('feedback');
                    feedback.className = 'feedback show correct';
                    feedback.innerHTML = `<div class="feedback-title">✅ Correct Answer!</div>`;
                    buttons.forEach(btn => {
                        if (btn.textContent === correctText) {
                            btn.classList.add('correct');
                        }
                    });
                } else {
                    const feedback = document.getElementById('feedback');
                    feedback.className = 'feedback show incorrect';
                    feedback.innerHTML = `<div class="feedback-title">❌ Incorrect - Here's the Correct Answer:</div>
                        <div class="working">📚 Working:<br>${question.working}</div>`;
                    buttons.forEach(btn => {
                        if (btn.textContent === correctText) {
                            btn.classList.add('correct');
                        }
                    });
                }
                
                document.getElementById('navButtons').style.display = 'flex';
            }

            updateNavigation();
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (currentQuestionIndex === 0) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'block';
            }

            if (currentQuestionIndex === shuffledQuestions.length - 1) {
                nextBtn.textContent = 'Submit & See Results ✅';
            } else {
                nextBtn.textContent = 'Next Question →';
            }
        }

        function answerQuestion(isCorrect, selectedText, working) {
            if (answers[currentQuestionIndex] !== undefined) {
                return;
            }

            const buttons = document.querySelectorAll('.answer-btn');
            const correctText = shuffledQuestions[currentQuestionIndex].correctText;
            
            buttons.forEach(btn => btn.disabled = true);

            answers[currentQuestionIndex] = isCorrect;

            if (isCorrect) {
                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback show correct';
                feedback.innerHTML = `<div class="feedback-title">✅ Correct Answer!</div>`;
                buttons.forEach(btn => {
                    if (btn.textContent === selectedText) {
                        btn.classList.add('correct');
                    }
                });
            } else {
                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback show incorrect';
                feedback.innerHTML = `<div class="feedback-title">❌ Incorrect - Here's the Correct Answer:</div>
                    <div class="working">📚 Working:<br>${working}</div>`;
                buttons.forEach(btn => {
                    if (btn.textContent === selectedText) {
                        btn.classList.add('incorrect');
                    }
                    if (btn.textContent === correctText) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('navButtons').style.display = 'flex';
            updateScore();
        }

        function nextQuestion() {
            if (currentQuestionIndex < shuffledQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function updateScore() {
            let totalCorrect = Object.values(answers).filter(a => a === true).length;
            const percentage = totalCorrect > 0 ? Math.round((totalCorrect / (currentQuestionIndex + 1)) * 100) : 0;
            document.getElementById('scorePercentage').textContent = percentage;
        }

        function showResults() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultsScreen').classList.add('active');

            const totalCorrect = Object.values(answers).filter(a => a === true).length;
            const percentage = Math.round((totalCorrect / shuffledQuestions.length) * 100);
            document.getElementById('finalScore').textContent = percentage + '%';

            let message = '';
            if (percentage === 100) message = '🌟 Perfect Score! Outstanding! 🌟';
            else if (percentage >= 90) message = '🎉 Excellent work! Keep it up!';
            else if (percentage >= 80) message = '👏 Great job! Well done!';
            else if (percentage >= 70) message = '💪 Good effort! Practice more!';
            else if (percentage >= 60) message = '📚 Nice try! Keep studying!';
            else message = '🎯 Keep practicing! You\'ll improve!';

            document.getElementById('scoreMessage').textContent = `${studentName}, you scored ${totalCorrect} out of ${shuffledQuestions.length} questions.\n${message}`;
        }

        function submitResults() {
            const totalCorrect = Object.values(answers).filter(a => a === true).length;
            const percentage = Math.round((totalCorrect / shuffledQuestions.length) * 100);
            const subject = `JSS2 Indices Assignment - ${studentName}`;
            const body = `Student Name: ${studentName}%0AScore: ${totalCorrect}/${shuffledQuestions.length}%0APercentage: ${percentage}%%0A%0AAssignment: Indices - First & Second Laws`;
            window.location.href = `mailto:justzcontentz@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }
    </script>
</body>
</html>
